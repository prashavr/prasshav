{% extends "base.html" %}

{% block title %}Edit Task{% endblock %}

{% block content %}
<div class="container mt-4">
    <h1>Edit Task</h1>
{% if error %}
    <div class="alert alert-danger">
        {{ error }}
    </div>
{% endif %}
    <form method="post">
        {% csrf_token %}

        <div class="mb-3">
            <label for="title" class="form-label">Title</label>
            <input
                type="text"
                class="form-control"
                id="title"
                name="title"
                value="{{ todo.title }}"
                required
            >
        </div>

        <div class="mb-3">
            <label for="description" class="form-label">
                Description
            </label>
            <textarea
                class="form-control"
                id="description"
                name="description"
                rows="4"
                required
            >{{ todo.description }}</textarea>
        </div>

        <button type="submit" class="btn btn-warning">
            Update Task
        </button>
    </form>
</div>
{% endblock %}
