{% extends "base.html" %}

{% block title %}Create Task{% endblock %}

{% block content %}
<div class="container mt-4">
    <h1>Create Task</h1>

    <form method="post">
        {% csrf_token %}

        <div class="mb-3">
            <label for="title" class="form-label">Title</label>
            <input
                type="text"
                class="form-control"
                id="title"
                name="title"
                required
            >
        </div>

        <div class="mb-3">
            <label for="description" class="form-label">
                Description
            </label>
            <textarea
                class="form-control"
                id="description"
                name="description"
                rows="4"
                required
            ></textarea>
        </div>

        <button type="submit" class="btn btn-primary">
            Create Task
        </button>
    </form>
</div>
{% endblock %}
